{% extends 'base.html' %}{% block title %}Cadastro · Portal Python{% endblock %}{% block content %}<div class="auth card"><h1>Criar conta</h1><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Nome<input name="name" required maxlength="120"></label><label>E-mail<input name="email" type="email" required maxlength="255"></label><label>Senha<input name="password" type="password" minlength="8" required></label><label>Confirmar senha<input name="confirm_password" type="password" minlength="8" required></label><button class="btn" type="submit">Cadastrar</button></form><a class="google" href="{{url_for('auth.google_login')}}">Continuar com Google</a><p>Já possui conta? <a href="{{url_for('auth.login')}}">Entrar</a></p></div>{% endblock %}
