{% extends 'base.html' %}{% block content %}<h1>Módulos</h1><form class="card formgrid" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input name="name" placeholder="Nome da módulo" required><select name="series_id" required><option value="">Nível...</option>{% for s in series %}<option value="{{s.id}}">{{s.name}}</option>{% endfor %}</select><button class="btn">Criar módulo</button></form><div class="list">{% for s in subjects %}<div class="card row"><div><h2>{{s.name}}</h2><p>{{s.series.name}}</p></div><div><a href="{{url_for('admin.subject_edit',id=s.id)}}">Editar</a><form class="inline" method="post" action="{{url_for('admin.subject_delete',id=s.id)}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="danger">Excluir</button></form></div></div>{% endfor %}</div>{% endblock %}
