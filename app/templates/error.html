{% extends 'base.html' %}
{% block title %}{{ error_title or 'Ops!' }} · Portal Python{% endblock %}
{% block content %}
<div class="card center error-page">
  <div class="uiverse-error-card" aria-hidden="true"><img src="{{url_for('static', filename='icons/ui/bolt.svg')}}" alt=""></div>
  <h1>{{ error_title or 'Ops!' }}</h1>
  <p>{{ message }}</p>
  {% if back_url %}
    <a class="btn" href="{{ back_url }}">Voltar ao material</a>
  {% else %}
    <a class="btn" href="{{ url_for('home') }}">Voltar ao início</a>
  {% endif %}
</div>
{% endblock %}
