{% extends 'base.html' %}{% block title %}Notificações · Portal JM{% endblock %}{% block content %}<section class="student-shell"><span class="eyebrow">AVISOS</span><h1>Notificações</h1><div class="list">{% for n in notifications %}<a class="card" href="{{n.link or '#'}}"><strong>{{n.message}}</strong><p class="muted">{{n.created_at.strftime('%d/%m/%Y %H:%M')}}</p></a>{% else %}<div class="card">Nenhuma notificação.</div>{% endfor %}</div></section>{% endblock %}
